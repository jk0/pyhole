[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irc-pyhole"
version = "1.0.0"
description = "A modular IRC and Slack bot."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Josh Kearney", email = "josh@jk0.org" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat :: Internet Relay Chat",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "irc>=20.0",
    "requests>=2.32",
    "slack-sdk>=3.27",
]

[project.optional-dependencies]
launchpad = ["launchpadlib>=1.11"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/jk0/pyhole"
Repository = "https://github.com/jk0/pyhole"

[project.scripts]
pyhole = "pyhole.main:main"

[tool.setuptools.packages.find]
include = ["pyhole*"]

[tool.setuptools.package-data]
pyhole = ["templates/*.html", "data/pyhole.conf.sample"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "doc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # handled by formatter; long IRC/log lines happen
    "B905",   # zip(..., strict=) is noise in this codebase
    "UP047",  # TypeVar on decorator helpers is clearer than PEP 695 here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
