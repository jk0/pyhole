name: CI

on:
  push:
    branches: [c-port, main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev
      - name: Test
        run: make -C c test
      - name: Build
        run: make -C c
